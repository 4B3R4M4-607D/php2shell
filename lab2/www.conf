; One worker, static pool: every request lands on the same process, so the
; polluted ini state is deterministic instead of a coin flip.
[www]
listen = 9000
pm = static
pm.max_children = 1
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 1
pm.max_requests = 0
clear_env = no
catch_workers_output = yes
listen.allowed_clients = 172.19.0.3
